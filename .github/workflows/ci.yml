name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  IMAGE_NAME: ghcr.io/seobserver/keydb

jobs:
  build-ubuntu-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Assert native AMD64 runner
        run: test "$(uname -m)" = x86_64
      - name: Build jemalloc and TLS
        run: |
          sudo apt-get update
          sudo apt-get -y install uuid-dev libcurl4-openssl-dev libbz2-dev zlib1g-dev libsnappy-dev liblz4-dev libzstd-dev libgflags-dev
          make BUILD_TLS=yes ENABLE_FLASH=no NO_MOTD=yes -j2

  build-libc-malloc:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Assert native AMD64 runner
        run: test "$(uname -m)" = x86_64
      - name: Build libc malloc and TLS
        run: |
          sudo apt-get update
          sudo apt-get -y install uuid-dev libcurl4-openssl-dev libbz2-dev zlib1g-dev libsnappy-dev liblz4-dev libzstd-dev libgflags-dev
          make MALLOC=libc BUILD_TLS=yes ENABLE_FLASH=no NO_MOTD=yes -j2

  test-main:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group:
          - core-early
          - replication
          - persistence-tools
          - psync-multimaster
          - core-late
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Assert native AMD64 runner
        run: test "$(uname -m)" = x86_64
      - name: Build test binary
        run: |
          sudo apt-get update
          sudo apt-get -y install gdb tcl tcl-tls uuid-dev libcurl4-openssl-dev libbz2-dev zlib1g-dev libsnappy-dev liblz4-dev libzstd-dev libgflags-dev
          make BUILD_TLS=yes ENABLE_FLASH=no NO_MOTD=yes -j2
          ./utils/gen-test-certs.sh
      - name: Verify complete main-suite partition
        run: ./ci/run-main-suite.sh --verify
      - name: Run ${{ matrix.group }}
        env:
          SEOBSERVER_TEST_GDB: "1"
        run: ./ci/run-main-suite.sh '${{ matrix.group }}'
      - name: Dump failed test server logs
        if: failure()
        run: |
          find tests/tmp -type f \( -name stdout -o -name stderr \) -print -exec tail -n 500 {} \; || true

  test-auxiliary:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cluster
            command: ./runtest-cluster --dont-clean --tls --config server-threads 3
          - suite: sentinel
            command: ./runtest-sentinel
          - suite: module
            command: ./runtest-moduleapi --dump-logs
          - suite: defrag-edge
            command: ./runtest --clients 1 --single unit/memefficiency --only "Active defrag edge case" --verbose --dump-logs --tls --config server-threads 3
          - suite: rotation
            command: ./runtest-rotation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Assert native AMD64 runner
        run: test "$(uname -m)" = x86_64
      - name: Build test binary
        run: |
          sudo apt-get update
          sudo apt-get -y install tcl tcl-tls uuid-dev libcurl4-openssl-dev libbz2-dev zlib1g-dev libsnappy-dev liblz4-dev libzstd-dev libgflags-dev
          make BUILD_TLS=yes ENABLE_FLASH=no NO_MOTD=yes -j2
          ./utils/gen-test-certs.sh
      - name: Run ${{ matrix.suite }} suite
        run: ${{ matrix.command }}
      - name: Dump failed test server logs
        if: failure()
        run: |
          find tests/tmp tests/cluster -type f \( -name stdout -o -name stderr -o -name log.txt \) -print -exec tail -n 500 {} \; || true

  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Assert native AMD64 runner
        run: test "$(uname -m)" = x86_64
      - name: Set image metadata
        id: metadata
        shell: bash
        run: |
          revision=$(git rev-parse HEAD)
          source_date_epoch=$(git show -s --format=%ct HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=$GITHUB_REF_NAME
          else
            version=ci-$revision
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_NAME:$version" >> "$GITHUB_OUTPUT"
      - name: Build exact source image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --file pkg/docker/seobserver/Dockerfile \
            --build-arg IMAGE_VERSION='${{ steps.metadata.outputs.version }}' \
            --build-arg SOURCE_REVISION='${{ steps.metadata.outputs.revision }}' \
            --build-arg SOURCE_DATE_EPOCH='${{ steps.metadata.outputs.source_date_epoch }}' \
            --tag '${{ steps.metadata.outputs.image }}' \
            .
      - name: Smoke-test packaged runtime
        run: |
          ./pkg/docker/seobserver/smoke-test.sh \
            '${{ steps.metadata.outputs.image }}' \
            '${{ steps.metadata.outputs.revision }}' \
            '${{ steps.metadata.outputs.version }}'
      - name: Export exact tested image
        if: startsWith(github.ref, 'refs/tags/v6.3.3-seobserver.')
        run: docker save '${{ steps.metadata.outputs.image }}' | gzip -1 > /tmp/keydb-image.tar.gz
      - name: Upload exact tested image
        if: startsWith(github.ref, 'refs/tags/v6.3.3-seobserver.')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keydb-release-image
          path: /tmp/keydb-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v6.3.3-seobserver.')
    needs:
      - build-ubuntu-latest
      - build-libc-malloc
      - test-main
      - test-auxiliary
      - container
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: keydb-release-image
          path: /tmp
      # sigstore/cosign-installer v4.1.2
      - name: Install the pinned cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2
      # anchore/sbom-action v0.24.0
      - name: Install the pinned Syft release
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
      - name: Validate immutable tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v6\.3\.3-seobserver\.[0-9]+$ ]]
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE_NAME:$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag $IMAGE_NAME:$GITHUB_REF_NAME" >&2
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact tested image
        id: publish
        run: |
          set -Eeuo pipefail
          gunzip --stdout /tmp/keydb-image.tar.gz | docker load
          docker push "$IMAGE_NAME:$GITHUB_REF_NAME"
          docker buildx imagetools inspect "$IMAGE_NAME:$GITHUB_REF_NAME"
          image_ref="$(
            docker image inspect "$IMAGE_NAME:$GITHUB_REF_NAME" \
              --format '{{index .RepoDigests 0}}'
          )"
          [[ "$image_ref" =~ ^ghcr\.io/seobserver/keydb@sha256:[0-9a-f]{64}$ ]]
          [[ "$(
            docker image inspect "$IMAGE_NAME:$GITHUB_REF_NAME" \
              --format '{{.Config.User}}'
          )" == 999:999 ]]
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX and SLSA predicates
        env:
          KEYDB_IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          syft "$KEYDB_IMAGE_REF" \
            --output spdx-json=/tmp/keydb-sbom.spdx.json
          jq -e '.spdxVersion == "SPDX-2.3"' \
            /tmp/keydb-sbom.spdx.json >/dev/null
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg image_ref "$KEYDB_IMAGE_REF" \
            --arg invocation_id \
              "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --arg release_tag "$GITHUB_REF_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            '{
              "buildDefinition": {
                "buildType": "https://github.com/SEObserver/KeyDB/pkg/docker/seobserver/v1",
                "externalParameters": {
                  "seobserverCommit": $commit,
                  "workflowRef": $workflow_ref,
                  "releaseTag": $release_tag,
                  "platform": "linux/amd64"
                },
                "internalParameters": {
                  "imageRef": $image_ref
                },
                "resolvedDependencies": [{
                  "uri": ("git+https://github.com/" + $repository + "@" + $commit),
                  "digest": {"gitCommit": $commit}
                }]
              },
              "runDetails": {
                "builder": {"id": ("https://github.com/" + $workflow_ref)},
                "metadata": {"invocationId": $invocation_id}
              }
            }' > /tmp/keydb-provenance.slsa1.predicate.json
      - name: Sign and attest the immutable image
        env:
          KEYDB_IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          cosign sign --yes "$KEYDB_IMAGE_REF"
          cosign attest --yes \
            --predicate /tmp/keydb-sbom.spdx.json \
            --type spdxjson \
            "$KEYDB_IMAGE_REF"
          cosign attest --yes \
            --predicate /tmp/keydb-provenance.slsa1.predicate.json \
            --type slsaprovenance1 \
            "$KEYDB_IMAGE_REF"
      - name: Verify signatures and attestations from GHCR
        env:
          KEYDB_IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          verification_args=(
            --certificate-identity "$identity"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY"
            --certificate-github-workflow-sha "$GITHUB_SHA"
            --certificate-github-workflow-trigger "$GITHUB_EVENT_NAME"
            --certificate-github-workflow-ref "$GITHUB_REF"
          )
          cosign verify "${verification_args[@]}" "$KEYDB_IMAGE_REF" \
            >/tmp/keydb-signature.verify.json
          cosign verify-attestation "${verification_args[@]}" \
            --type spdxjson "$KEYDB_IMAGE_REF" \
            | jq -s . >/tmp/keydb-sbom.verify.json
          cosign verify-attestation "${verification_args[@]}" \
            --type slsaprovenance1 "$KEYDB_IMAGE_REF" \
            | jq -s . >/tmp/keydb-provenance.verify.json
          jq -e 'length > 0' /tmp/keydb-signature.verify.json >/dev/null
          jq -e 'length > 0' /tmp/keydb-sbom.verify.json >/dev/null
          jq -e \
            --arg commit "$GITHUB_SHA" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            'any(.[];
              (.payload | @base64d | fromjson) as $statement
              | $statement.predicate.buildDefinition.externalParameters
                  .seobserverCommit == $commit
              and $statement.predicate.buildDefinition.externalParameters
                  .workflowRef == $workflow_ref
            )' /tmp/keydb-provenance.verify.json >/dev/null
      - name: Verify private package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility=$(gh api "/users/$GITHUB_REPOSITORY_OWNER/packages/container/keydb" --jq .visibility)
          test "$visibility" = private
